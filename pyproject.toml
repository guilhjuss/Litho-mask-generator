[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanofab-process"
version = "0.1.0"
description = "A small YAML-driven nanofabrication mask generator"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "gdstk>=0.9.60,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
nanofab = "nanofab_process.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
